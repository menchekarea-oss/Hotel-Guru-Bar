<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Guru Billing v14 — Reset Local Cache</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#17151a;color:#fff8ed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(480px,100%);padding:28px;border:1px solid rgba(240,195,125,.28);border-radius:16px;background:#211f24;box-shadow:0 24px 70px rgba(0,0,0,.38)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#c27b2b;color:#17100b;font-weight:900}h1{margin:16px 0 8px;font-size:26px}p{color:#cfc4b8;line-height:1.5}.status{margin-top:18px;padding:12px;border-radius:8px;background:#121116;color:#f0c37d;font-weight:800}button{width:100%;min-height:46px;margin-top:16px;border:0;border-radius:8px;background:#c27b2b;color:#17100b;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">BUILD 14.0.0</span>
    <h1>Preparing the latest Hotel Guru Billing</h1>
    <p>This removes only old Hotel Guru Billing service-worker caches. It does not delete sales, running tables, menu data, owner password, or pending uploads.</p>
    <div class="status" id="status">Clearing old app cache…</div>
    <button id="retry" type="button" hidden>Open Hotel Guru Billing v14</button>
  </main>
  <script>
    async function reset() {
      const status = document.querySelector('#status');
      const retry = document.querySelector('#retry');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.filter((name) => name.startsWith('guru-pos-') || name.startsWith('hotel-guru-billing-')).map((name) => caches.delete(name)));
        }
        sessionStorage.setItem('guruLocalDevReloadV14', '1');
        status.textContent = 'Cache cleared. Opening Hotel Guru Billing BUILD 14…';
        setTimeout(() => location.replace('/?build=14&t=' + Date.now()), 500);
      } catch (error) {
        status.textContent = 'Automatic reset could not finish. Press the button below.';
        retry.hidden = false;
      }
    }
    document.querySelector('#retry').addEventListener('click', () => location.replace('/?build=14&t=' + Date.now()));
    reset();
  </script>
</body>
</html>
